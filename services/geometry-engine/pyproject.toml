[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patroner-geometry-engine"
version = "0.1.0"
description = "Patroner Authoritative Computational Geometry & Verification Oracle Engine (M00 Reference Harness)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mpmath==1.4.1",
  "pydantic==2.14.3",
  "jsonschema==4.26.0",
  "numpy==2.2.6",
  "scipy==1.15.3",
]

[project.optional-dependencies]
flint = ["python-flint==0.9.0"]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
