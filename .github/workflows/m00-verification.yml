name: M00 Numerical Qualification & Geometry Verification (Python 3.12)

on:
  push:
    branches:
      - "feat/m00-*"
      - "fix/m00-*"
      - "integration/m00-*"
      - "docs/r2.2-*"
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  geometry-python312-verification:
    name: Python 3.12.16 uv Locked Verification & Determinism Gate (M00.1–M00.10)
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (required by Workstream B DXF/seam & C0-Legacy TS subprocesses)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/geometry-engine/uv.lock"

      - name: Install pinned Python 3.12.16
        run: uv python install 3.12.16

      - name: Verify uv.lock integrity (--check)
        run: uv lock --directory services/geometry-engine --check --python 3.12.16

      - name: Sync locked geometry-engine dependencies
        run: uv sync --directory services/geometry-engine --locked --all-extras --python 3.12.16

      - name: Assert Python 3.12.x runtime in locked environment
        run: |
          uv run --directory services/geometry-engine --locked --python 3.12.16 python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Run full pytest M00 verification suite under Python 3.12
        run: uv run --directory services/geometry-engine --locked --python 3.12.16 pytest -v

      - name: Execute Workstream B standalone DXF-AAMA & DEC-11 seam parity harness
        run: uv run --directory services/geometry-engine --locked --python 3.12.16 python ../../scripts/m00_verify_production_dxf_and_seams.py

      - name: Execute deterministic M00 evidence generator twice (PYTHONHASHSEED=0)
        run: |
          uv run --directory services/geometry-engine --locked --python 3.12.16 python ../../scripts/m00_execute_all.py
          uv run --directory services/geometry-engine --locked --python 3.12.16 python ../../scripts/m00_execute_all.py

      - name: Enforce strict deterministic diff gate (no || true; wall-clock observations isolated)
        run: |
          git diff --exit-code -- \
            artifacts/m00/ \
            M00_*.json \
            ReproducibleEnvironmentManifest.json \
            ':!artifacts/m00/IntervalCandidateBenchmarks.json' \
            ':!artifacts/m00/RuntimeBenchmarkObservation.json'

  typescript-frontend-checks:
    name: TypeScript Typecheck, Build & Node Test Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production Vite build
        run: npm run build

      - name: Run Node test runner suite (tsx scripts/test-runner.ts)
        run: npm test
